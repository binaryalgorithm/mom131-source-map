# DOSBox-X config for the instrumented harness (tools/harness/dosbox.py). Runs v1.31 from work/harness/game on a
# private Windows desktop: never visible, never takes focus. Input, frames and RAM go through DOSBox-X's Game Link
# shared memory (output=gamelink: DOSBox-X reads keyboard + mouse from it and writes every frame into it). Keep
# scaler=none: a scaled frame larger than Game Link's 1280x1024 limit disables it (hidden "Game Link" error box).
[sdl]
fullscreen=false
output=surface
gamelink master=true
autolock=false
mouse_emulation=never
showmenu=false
priority=normal,normal
waitonerror=false
windowresolution=original
[render]
scaler=none
aspect=false
[dosbox]
machine=svga_s3
memsize=16
captures=@ROOT_WIN@\work\harness\capture
[cpu]
core=dynamic
cycles=max
[mixer]
nosound=true
[dos]
xms=true
ems=true
[autoexec]
mount c "@ROOT_WIN@\work\harness\game"
c:
MAGIC.EXE
